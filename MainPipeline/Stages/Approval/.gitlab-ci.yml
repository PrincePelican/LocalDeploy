approval_check:
  stage: approval_check
  script:
    - apk add --no-cache curl jq
    - |
      if [ -z "${RELEASE_TOKEN:-}" ]; then
        echo "Brak zmiennej RELEASE_TOKEN potrzebnej do sprawdzenia approvali."
        exit 1
      fi

      api_url="${CI_API_V4_URL/http:\/\/localhost:8080/http:\/\/local-gitlab}"
      approvals=$(curl --fail-with-body --silent --show-error \
        --header "PRIVATE-TOKEN: ${RELEASE_TOKEN}" \
        "${api_url}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/approvals")
      approval_count=$(printf '%s' "${approvals}" | jq '.approved_by | length')

      echo "Liczba approvali: ${approval_count}"
      if [ "${approval_count}" -lt 1 ]; then
        echo "Brak wymaganego approvala."
        exit 1
      fi

      echo "Approval check przeszedl."
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
      when: manual